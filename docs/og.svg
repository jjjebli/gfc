<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  <rect x="0" y="0" width="1200" height="1" fill="#262626"/>
  <rect x="0" y="629" width="1200" height="1" fill="#262626"/>

  <!-- logomark -->
  <g transform="translate(84,231)">
    <rect x="0" y="0" width="168" height="168" rx="38" fill="#050505" stroke="#262626" stroke-width="2"/>
    <g stroke="#EDEDED" stroke-width="17" stroke-linecap="round">
      <line x1="66" y1="42" x2="66" y2="84"/>
      <line x1="45" y1="63" x2="87" y2="63"/>
    </g>
    <g stroke="#787878" stroke-width="17" stroke-linecap="round">
      <line x1="97" y1="118" x2="129" y2="118"/>
    </g>
  </g>

  <!-- wordmark + subtitle -->
  <text x="330" y="330" font-size="120" fill="#EDEDED" font-style="italic">gfc</text>
  <text x="336" y="376" font-size="30" fill="#8A8A8A" font-family="'Courier New', monospace">git-for-context</text>

  <!-- tagline -->
  <text x="84" y="480" font-size="40" fill="#C9C9C9">Stop re-paying for files your model already read.</text>

  <!-- stub line -->
  <g font-family="'Courier New', monospace" font-size="24">
    <text x="84" y="528" fill="#9A9A9A">[gfc] unchanged: byte-identical to your last full read — nothing new to show</text>
  </g>

  <!-- measured number, right -->
  <text x="1116" y="112" font-size="72" fill="#EDEDED" text-anchor="end">−34%</text>
  <text x="1116" y="146" font-size="21" fill="#6E6E6E" font-family="'Courier New', monospace" text-anchor="end">measured context / turn</text>

  <!-- repo, bottom-right -->
  <text x="1116" y="578" font-size="23" fill="#6E6E6E" font-family="'Courier New', monospace" text-anchor="end">github.com/jjjebli/gfc</text>
</svg>
